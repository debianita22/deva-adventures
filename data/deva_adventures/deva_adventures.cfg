# Deva's Awesome Adventures - impostazioni per i grandi
# Cambia i valori e riavvia il gioco. Le righe che iniziano con # sono commenti.
# Quasi tutto si cambia anche dentro il gioco: nel menu principale tieni premuti
# L e R insieme per 2 secondi sulla carta Opzioni. Quelle opzioni finiscono in
# deva_adventures_opzioni.cfg nella cartella dei salvataggi e valgono sopra
# questo file (solo i valori cambiati). Tutto il resto: il manuale (manuale.pdf).

# Durata di una sessione in minuti (il tempo di gioco: pausa, opzioni e
# salvataggi non contano). Due minuti e mezzo prima il menu avvisa "Ancora un
# gioco, e poi la nanna!"; finito il tempo, al primo ritorno al menu Deva
# saluta, va a nanna e il gioco si chiude. 0 = nessun limite.
sessione_minuti = 15

# Livello di partenza di Conta, usato solo alla prima partita di un profilo:
# poi il gioco si adatta da solo e ricorda il livello raggiunto.
#   1: da 1 a 5 oggetti    2: da 3 a 8    3: da 6 a 12
#   4: da 10 a 16          5: da 12 a 20
livello_iniziale = 2

# Domande per round (una stellina ciascuna) prima del premio nel camerino.
domande_per_round = 5

# Volumi da 0 a 100.
volume_voce = 100
volume_musica = 45
volume_effetti = 70

# Vibrazione a ogni risposta giusta (1 = si, 0 = no).
vibrazione = 1

# Animazioni: transizioni fra una scena e l'altra e sfondi animati (stelle,
# lucciole, pioggia, neve...). 0 = sfondi fermi e cambi di scena immediati
# (se il dispositivo rallenta o se la distraggono).
animazioni = 1

# Il nome del primo profilo, quello che scrive nel gioco "Il mio nome"
# (solo lettere A-Z, al massimo 10). Gli altri profili hanno il nome scritto
# nel gioco (menu principale -> Salvataggi).
nome = DEVA

# Giochi nuovi uno alla volta (1) oppure tutti aperti da subito (0),
# e quanti round completati servono per aprire il gioco successivo.
sblocco_giochi = 1
round_per_sblocco = 2

# Le quattro avventure: mappa, mostri e sfide (1 = si, 0 = solo il menu dei
# giochi), e quanti round caricano la bacchetta per sfidare il mostro successivo.
# Per ricominciare le avventure da capo: nel salvataggio deva_adventures.sav
# cancella le righe avventura, capitolo, carica, racconti ed epilogo, ma lascia
# l'ultima riga, "# fine" (senza, il gioco crede il file rovinato da uno
# spegnimento e riprende la copia di prima). Per ricominciare tutto, anche
# giochi e premi: Salvataggi -> Y (cancella) sul profilo.
storia = 1
round_per_sfida = 2
